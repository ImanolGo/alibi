[project]
name = "alibi"
version = "0.0.1"
description = "A murder mystery where every suspect is an LLM agent."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "jinja2>=3.1",
    "fastapi>=0.115",
    "langgraph>=0.2",
    "litellm>=1.55",
    "mcp>=1.2",
    "opentelemetry-api>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-sdk>=1.27",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "rich>=13.9",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
alibi = "alibi.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alibi"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.7",
    "types-pyyaml>=6.0",
]
ml = [
    "datasets>=3.0",
    "onnx>=1.17",
    "onnxruntime>=1.19",
    "torch>=2.4",
    "transformers>=4.44",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer's documented API puts Option()/Argument() calls in defaults.
"src/alibi/cli.py" = ["B008"]
# FastAPI's dependency injection uses Form()/Query() calls in defaults.
"src/alibi/web.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
